name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder app values: the tests never sign in with Google or touch a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcon_app_unused
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pcon_app_unused
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcon_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci # also runs `prisma generate`

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit + database)
        run: npm test

      - name: Build
        run: npm run build
