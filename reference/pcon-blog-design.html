<style>

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;

a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--mint2));display:grid;place-items:center;color:#03100d;font:700 15px var(--mono);font-style:normal}
.brand small{display:block;font:400 11px var(--mono);color:var(--mute);letter-spacing:0}
.links{display:flex;gap:30px;font-size:15px;color:var(--mute)}
.links a:hover,.links a.on{color:var(--ink)}
.join{border:1px solid var(--line);padding:9px 18px;border-radius:999px;font-size:14px;color:var(--ink);background:rgba(10,31,25,.6)}
.join:hover{border-color:var(--mint)}

/* index */
.hero{padding:72px 0 36px}
.tag{display:inline-flex;align-items:center;gap:10px;font:400 13px var(--mono);color:var(--mute)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
h1{font-size:clamp(46px,8vw,96px);line-height:.98;letter-spacing:-.04em;margin:18px 0 18px;font-weight:600}

.lede{max-width:560px;color:var(--mute);font-size:18px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:40px 0 32px}

.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);transition:border-color .2s,transform .2s}

{id:'dp-without-tears',cat:'Algorithms',hue:162,title:'Dynamic programming without the tears',ex:'Stop memorising recurrences. A way to find the state, the transition and the base case for any DP problem.',au:'Aarav Sinha',role:'Pre-final year, CSE',bio:'Codeforces specialist who runs the Tuesday problem-solving sessions.',date:'Nov 8, 2026',min:9,
body:'<p>Every DP problem is the same question in disguise: <em>what is the smallest piece of information I need to carry forward?</em> Once you can answer that, the code writes itself.</p><h2>Start with the state</h2><p>Take the classic “maximum sum with no two adjacent elements”. At index <code>i</code> you only care about the best sum up to <code>i</code>. Nothing else matters.</p><pre><code>dp[i] = max(dp[i-1], dp[i-2] + a[i]);</code></pre><blockquote>If your state needs more than two or three parameters, you have probably picked the wrong state.</blockquote><h2>A checklist</h2><ul><li>Define what <code>dp[i]</code> means in one sentence.</li><li>Write the transition on paper before any code.</li><li>Check the base cases against a tiny input.</li></ul><p>Practise this on ten problems and the pattern becomes automatic.</p>'},
{id:'nextjs-for-club-sites',cat:'Web Dev',hue:172,title:'Building our club site with Next.js',ex:'How we structured routes, content and deployment for the PCON website, and what we would do differently.',au:'Meera Kapoor',role:'Final year, IT',bio:'Leads the web team and maintains the PCON website.',date:'Nov 2, 2026',min:7,
body:'<p>When we rebuilt the PCON site we wanted something any member could contribute to without learning a CMS.</p><h2>Routes</h2><p>Blogs live under <code>/blogs/[id]</code>, and the listing sits at <code>/blog</code>. Each post is a Markdown file with front matter.</p><pre><code>export async function generateStaticParams() {\n  return posts.map((p) =&gt; ({ id: p.id }));\n}</code></pre><p>Static generation keeps every page fast and free to host.</p>'},
{id:'intro-to-llvm',cat:'Computer Science',hue:150,title:'Profiling code with LLVM',ex:'A first look at how compilers see your program, and how to measure where the time actually goes.',au:'Rohan Das',role:'Third year, CSE',bio:'Systems nerd. Compilers, kernels and anything low level.',date:'Oct 27, 2026',min:12,
body:'<p>Before optimising anything, measure it. LLVM gives us tools that show exactly which functions burn your cycles.</p><h2>Build with symbols</h2><pre><code>clang++ -O2 -g main.cpp -o main</code></pre><p>With debug symbols on, a profiler can map samples back to your source lines.</p>'},
{id:'max-likelihood',cat:'Machine Learning',hue:185,title:'Maximum likelihood, from scratch',ex:'Why do we minimise cross-entropy? Derive it from the one principle behind most of ML.',au:'Ishita Verma',role:'Pre-final year, ECE',bio:'Reads papers on weekends. Runs the ML reading group.',date:'Oct 19, 2026',min:10,
body:'<p>Maximum likelihood asks one thing: which parameters make the data we saw most probable?</p><blockquote>Loss functions are not arbitrary. Most of them are a likelihood in disguise.</blockquote><p>Work through the coin-flip example first, then the Gaussian case, and the rest follows.</p>'},
{id:'what-is-a-dll',cat:'Miscellaneous',hue:140,title:'What is a .dll, really?',ex:'Shared libraries on Windows explained without the jargon, including why “DLL hell” happens.',au:'Kabir Mehta',role:'Second year, CSE',bio:'Curious about how things work under the hood.',date:'Oct 11, 2026',min:6,
body:'<p>A <code>.dll</code> is a bundle of code that many programs share, so each one does not need its own copy.</p><h2>Why it matters</h2><p>Smaller programs, shared updates and plugin systems all rely on dynamic linking.</p>'},
{id:'distributed-bitcoin',cat:'Blockchain',hue:195,title:'Distributed systems through Bitcoin',ex:'Consensus, fault tolerance and trust, explained by the most famous distributed system ever built.',au:'Ananya Roy',role:'Final year, CSE',bio:'Backend developer and hackathon regular.',date:'Oct 3, 2026',min:14,
body:'<p>Bitcoin solves a problem that sounds impossible: getting strangers to agree without a referee.</p><h2>Longest chain wins</h2><p>Nodes always follow the longest valid chain, so cheating costs more than honesty pays.</p>'}

function card(p){return '<a class="card" href="#'+p.id+'">'+cover(p)+'<div class="body"><h3>'+p.title+'</h3><p>'+p.ex+'</p>'+meta(p)+'</div></a>'}
var cur='All';
function list(){var f=POSTS[0],rest=POSTS.slice(1);
if(cur!=='All'){rest=POSTS.filter(function(p){return p.cat===cur});f=null}
var h='<section class="hero"><span class="tag">THE PCON BLOG</span><h1>Ideas worth <span>shipping.</span></h1><p class="lede">Tutorials, deep dives and lessons learned, written by the students of NIT Jamshedpur.</p></section><div class="filters" role="group" aria-label="Filter by topic">';
CATS.forEach(function(c){h+='<button class="chip" aria-pressed="'+(c===cur)+'" data-c="'+c+'">'+c+'</button>'});
h+='</div>';
if(f)h+='<a class="feature" href="#'+f.id+'">'+cover(f)+'<div class="body"><span class="cat">Featured · '+f.cat+'</span><h2>'+f.title+'</h2><p>'+f.ex+'</p>'+meta(f)+'</div></a>';
h+='<div class="grid">'+(rest.length?rest.map(card).join(''):'<p class="empty">No posts in this topic yet. Want to write the first one?</p>')+'</div>';
return h}
function postOld(p){var more=POSTS.filter(function(x){return x.id!==p.id}).slice(0,3);
return '<a class="back" href="#blog">← All posts</a><article><span class="cat">'+p.cat+'</span><h1>'+p.title+'</h1><div class="byline"><span class="av">'+ini(p.au)+'</span><div><b>'+p.au+'</b><span>'+p.role+'</span></div><div class="when">'+p.date+'<br>'+p.min+' min read</div></div>'+cover(p)+'<div class="prose">'+p.body+'</div><div class="author"><span class="av">'+ini(p.au)+'</span><div><b>Written by '+p.au+'</b><p>'+p.role+'. '+p.bio+'</p></div></div></article><section class="more"><h2>Keep reading</h2><div class="grid" style="padding:0">'+more.map(card).join('')+'</div></section>'}
function post(p){var more=POSTS.filter(function(x){return x.id!==p.id}).slice(0,3),a=ini(p.au);
return '<div id="bar"></div><a class="back" href="#blog">← All posts</a><header class="phead"><div class="crumbs"><span class="pill">'+p.cat+'</span><span>'+p.min+' min read</span></div><h1>'+p.title+'</h1><p class="dek">'+p.ex+'</p><div class="by"><span class="av ring">'+a+'</span><div class="who"><small>Written by</small><b>'+p.au+'</b><span>'+p.role+'</span></div><div class="act"><span class="date">'+p.date+'</span><button class="copy" id="cp">Copy link</button></div></div></header><div class="hcover">'+cover(p)+'</div><div class="pgrid"><aside class="side"><div class="acard"><span class="av big ring">'+a+'</span><small>Written by</small><b>'+p.au+'</b><span class="role">'+p.role+'</span><p>'+p.bio+'</p><a class="more-by" href="#blog">More from PCON ↗</a></div></aside><div class="prose">'+p.body+'</div></div><div class="cta"><div><h2>Have something to teach?</h2><p>Every PCON post is written by a member. Pitch yours.</p></div><a class="join" href="#blog">Write for PCON ↗</a></div><section class="more"><h2>Keep reading</h2><div class="grid" style="padding:0">'+more.map(card).join('')+'</div></section>'}
function render(){var id=location.hash.slice(1),p=POSTS.filter(function(x){return x.id===id})[0],app=document.getElementById('app');
app.innerHTML=p?post(p):list();document.title=(p?p.title+' | ':'Blog | ')+'PCON NIT Jamshedpur';if(p)window.scrollTo(0,0)}
document.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b){cur=b.dataset.c;render()}if(e.target.id==='cp'){var t=e.target;try{navigator.clipboard.writeText(location.href).then(function(){t.textContent='Copied'})}catch(x){t.textContent='Copy failed'}}});
window.addEventListener('scroll',function(){var b=document.getElementById('bar');if(!b)return;var h=document.documentElement.scrollHeight-innerHeight;b.style.width=(h>0?scrollY/h*100:0)+'%'});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
